# GeoTIFF ToolKit configuration -- the file a source checkout and the ArcGIS Pro toolbox
# read. Every key here is read by the code; gttk/resources/config.toml is the copy that
# ships in the wheel, and tests/unit/test_config_loader.py keeps the two in step.

[paths]
# OSGeo4W installation root, used by the ArcGIS Pro path to run a standalone GDAL.
osgeo4w = "C:/OSGeo4W"

[gui]
# Language of the ArcGIS Pro toolbox.  "auto" follows ArcGIS Pro's display language, then
# Windows'; "en" or "es" forces one.  The GTTK_LANG environment variable overrides this.
language = "auto"

[statistics]
# === Statistics Configuration ===
# The calculator selects fast (in-memory) or blocked (chunked) processing from the file
# size and the available RAM. Everything below tunes that choice.

# Maximum pixels per band for the fast path (0 = auto-detect from RAM).
# The fast path loads the whole image; the blocked path reads it in chunks.
# Auto-detection uses 25% of the available RAM. Example values:
#   0            # Auto-detect (default, recommended)
#   268435456    # 16,384² pixels (conservative for 16GB systems)
#   1073741824   # 32,768² pixels (high-memory systems)
max_pixels_fast_path = 0

# Block size for the blocked path, [height, width] in pixels.
# Larger blocks mean fewer reads and more memory per block.
# [4096, 4096] is 16.7MP per block (~67MB of Float32), safe for 16GB of RAM.
block_size = [4096, 4096]

# Force a strategy: "auto" (from file size and RAM), "fast" (may exhaust memory on large
# files) or "blocked" (slower, any size). For testing and debugging.
force_strategy = "auto"

# === Block Caching ===

# Read each alpha band block once and reuse it for every colour band (1.3-1.5x on RGBA).
cache_alpha_blocks = true

# Read each transparency-mask block once per block position (files with an IFD #1 mask).
cache_transparency_masks = true

# Fraction of pixels that must be 0 or max for an alpha band to count as strictly binary.
alpha_binary_threshold = 0.999

# Fraction above which an alpha band counts as near-binary (binary with artifacts).
alpha_near_binary_threshold = 0.99

# Treat a near-binary alpha band as a mask, with a tolerance for the artifacts, rather
# than computing full statistics for it.
treat_near_binary_as_mask = true
