# ==============================================================================
# Example Validation Rules for GeoTIFF ToolKit
# ==============================================================================
# This file demonstrates the validation rule schema with product-level organization.
# Users can create their own rules files following this format.
#
# File naming conventions:
# - example_rules.toml (this file) - tracked in Git as reference
# - *_rules.toml - ignored by Git (for custom product rules)
#
# Products can be defined across multiple files, but each product name
# must be unique across all files in the rules directory.
# ==============================================================================

# ==============================================================================
# DGED5 - Defense Gridded Elevation Data Level 5
# ==============================================================================
[DGED5]
title = "Defense Gridded Elevation Data Level 5"
description = "Validation rules for DGED5 DSM/DTM elevation products"
author = "National Geospatial-Intelligence Agency (NGA)"
updated = "2026-01-15"

# ------------------------------------------------------------------------------
# TIFF Tags (section: tag)
# ------------------------------------------------------------------------------

[[DGED5.tag]]
tag = 258
description = "BitsPerSample"
data_type = "integer"
constraint = "exact"
expected = 32
comment = "Must be 32-bit floating point"

[[DGED5.tag]]
tag = 259
description = "Compression"
data_type = "integer"
constraint = "enum"
expected = [5, 8]
comment = "Either 5=LZW (legacy) or 8=DEFLATE (new) is acceptable"

[[DGED5.tag]]
tag = 270
description = "ImageDescription"
data_type = "string"
constraint = "exists"
comment = "Description required but content not validated"

[[DGED5.tag]]
tag = 306
description = "DateTime"
data_type = "string"
constraint = "regex"
expected = "^\\d{4}:\\d{2}:\\d{2} \\d{2}:\\d{2}:\\d{2}$"
comment = "TIFF DateTime does not follow ISO 8601, only 20 chars including terminating NUL"

[[DGED5.tag]]
tag = 296
description = "ResolutionUnit"
data_type = "integer"
constraint = "forbidden"
comment = "Should not be present - only supports Inch or Centimeter for documents"

[[DGED5.tag]]
tag = 269
description = "DocumentName"
data_type = "string"
constraint = "regex"
expected = "^U_.*_20km_.*_GeoData_.*(?:DSM|DTM).*_\\d{2}$"
optional = true
comment = "Optional but must match file name sans suffix if present"

# ------------------------------------------------------------------------------
# GeoKeys (section: geokey)
# ------------------------------------------------------------------------------

[[DGED5.geokey]]
geokey = 1024
description = "GTModelTypeGeoKey"
data_type = "integer"
constraint = "exact"
expected = 1
comment = "1 = ModelTypeProjected (UTM or UPS)"

[[DGED5.geokey]]
geokey = 1025
description = "GTRasterTypeGeoKey"
data_type = "integer"
constraint = "exact"
expected = 2
comment = "2 = RasterPixelIsPoint for elevation"

[[DGED5.geokey]]
geokey = 3072
description = "ProjectedCRSGeoKey"
data_type = "integer"
constraint = "ranges"
expected = [
  { min = 32601, max = 32660 },
  { min = 32701, max = 32760 },
  { min = 5041, max = 5042 }
]
comment = "Valid UTM/UPS zone EPSG codes"

[[DGED5.geokey]]
geokey = 4096
description = "VerticalGeoKey"
data_type = "integer"
constraint = "exact"
expected = 3855
comment = "EPSG:3855 = EGM2008 geoid height"

[[DGED5.geokey]]
geokey = 2048
description = "GeodeticCRSGeoKey"
data_type = "integer"
constraint = "forbidden"
comment = "Must not be present in projected CRS files"

# ------------------------------------------------------------------------------
# GDAL Metadata with On-Demand Statistics (section: gdal)
# STATISTICS_* keys are computed on-demand from raster data via NumPy.
# Other keys are looked up in GDAL_METADATA tag (42112).
# Use colon delimiter for specific band (e.g., STATISTICS_MINIMUM:0).
# Without band suffix, statistics are validated against ALL bands.
# ------------------------------------------------------------------------------

[[DGED5.gdal]]
name = "STATISTICS_MINIMUM"
description = "Minimum Elevation (all bands)"
data_type = "float"
constraint = "range"
expected = { min = -430.0, max = 8850.0 }
comment = "Minimum elevation must be within valid global dry land range"

[[DGED5.gdal]]
name = "STATISTICS_MAXIMUM"
description = "Maximum Elevation (all bands)"
data_type = "float"
constraint = "range"
expected = { min = -430.0, max = 8850.0 }
comment = "Maximum elevation must be within valid global dry land range"

# ==============================================================================
# USGS 3D Elevation Program (3DEP)
# ==============================================================================
# Note: 3DEP produces DEMs (technically DTMs showing bare earth).

[3DEP]
title = "USGS 3DEP Digital Elevation Model"
description = "Validation rules for USGS 3DEP DEM products"
author = "United States Geological Survey"
updated = "2026-01-16"

[[3DEP.tag]]
tag = 258
description = "BitsPerSample"
data_type = "integer"
constraint = "exact"
expected = 32
comment = "32-bit float required for elevation data"

[[3DEP.tag]]
tag = 339
description = "SampleFormat"
data_type = "integer"
constraint = "exact"
expected = 3
comment = "3 = IEEE floating point"

[[3DEP.geokey]]
geokey = 1025
description = "GTRasterTypeGeoKey"
data_type = "integer"
constraint = "exact"
expected = 2
comment = "2 = RasterPixelIsPoint for elevation"

[[3DEP.geokey]]
geokey = 3072
description = "ProjectedCRSGeoKey"
data_type = "integer"
constraint = "ranges"
expected = [
  { min = 26901, max = 26920 },
  { min = 26955, max = 26955 }
]
comment = "Valid NAD83 or WGS84 UTM zone EPSG codes"

# ------------------------------------------------------------------------------
# GDAL Metadata with On-Demand Statistics
# ------------------------------------------------------------------------------

[[3DEP.gdal]]
name = "STATISTICS_MINIMUM"
description = "Minimum Elevation (all bands)"
data_type = "float"
constraint = "range"
expected = { min = -86.0, max = 6190.0 }
comment = "Minimum elevation must be within valid U.S. dry land range (Death Valley to Denali)"

[[3DEP.gdal]]
name = "STATISTICS_MAXIMUM"
description = "Maximum Elevation (all bands)"
data_type = "float"
constraint = "range"
expected = { min = -86.0, max = 6190.0 }
comment = "Maximum elevation must be within valid U.S. dry land range (Death Valley to Denali)"

# ==============================================================================
# USDA NAIP Orthoimagery (National Agriculture Imagery Program)
# ==============================================================================

[NAIP]
title = "USDA NAIP Orthoimagery"
description = "Validation rules for NAIP 4-band orthoimagery products"
author = "USDA Farm Service Agency"
updated = "2026-01-15"

[[NAIP.tag]]
tag = 258
description = "BitsPerSample"
data_type = "integer"
constraint = "exact"
expected = [8, 8, 8, 8]
comment = "8-bit image depth"

[[NAIP.tag]]
tag = 262
description = "PhotometricInterpretation"
data_type = "integer"
constraint = "exact"
expected = 2
comment = "2 = RGB"

[[NAIP.tag]]
tag = 270
description = "ImageDescription"
data_type = "string"
constraint = "regex"
expected = ".*USDA Farm Service Agency.*National Agriculture Imagery Program.*NAIP.*"
comment = "Must contain NAIP attribution text"

[[NAIP.tag]]
tag = 277
description = "SamplesPerPixel"
data_type = "integer"
constraint = "exact"
expected = 4
comment = "4 bands (R, G, B, NIR) - No alpha band"

[[NAIP.geokey]]
geokey = 1025
description = "GTRasterTypeGeoKey"
data_type = "integer"
constraint = "exact"
expected = 1
comment = "1 = RasterPixelIsArea for orthoimagery"

[[NAIP.geokey]]
geokey = 3072
description = "ProjectedCRSGeoKey"
data_type = "integer"
constraint = "ranges"
expected = [
  { min = 26901, max = 26920 },
  { min = 26955, max = 26955 }
]
comment = "NAD83 UTM zones for CONUS and Guam"

# ------------------------------------------------------------------------------
# GDAL Metadata with On-Demand Statistics and Color Interpretation
# ------------------------------------------------------------------------------

[[NAIP.gdal]]
name = "STATISTICS_VALID_PERCENT"
description = "Valid Pixel Percentage (all bands)"
data_type = "float"
constraint = "exact"
expected = 100.0
comment = "NAIP tiles must have 100% valid pixels"

[[NAIP.gdal]]
name = "COLORINTERP:0"
description = "Band 1 Color Interpretation"
data_type = "string"
constraint = "exact"
expected = "Red"
comment = "Band 1 must be Red"

[[NAIP.gdal]]
name = "COLORINTERP:1"
description = "Band 2 Color Interpretation"
data_type = "string"
constraint = "exact"
expected = "Green"
comment = "Band 2 must be Green"

[[NAIP.gdal]]
name = "COLORINTERP:2"
description = "Band 3 Color Interpretation"
data_type = "string"
constraint = "exact"
expected = "Blue"
comment = "Band 3 must be Blue"

[[NAIP.gdal]]
name = "COLORINTERP:3"
description = "Band 4 Color Interpretation"
data_type = "string"
constraint = "exact"
expected = "NIR"
comment = "Band 4 must be Near Infrared"

