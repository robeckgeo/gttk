# Spanish catalog for the ArcGIS Pro toolbox (toolbox/GTTK_Toolbox.pyt).
#
# Keys are the English source strings exactly as written in the toolbox (section
# titles come from gttk/utils/section_registry.py); values are what a Spanish ArcGIS
# Pro shows.  The tables only organise the file for review -- lookups are flat, so no
# key may appear twice anywhere in the file.  Keep every {placeholder} from the key.
# tests/unit/test_i18n_catalog.py checks all of that.
#
# Style:
#   - Neutral Latin-American Spanish with Mexican conventions (archivo, carpeta, equipo).
#   - Esri's ArcGIS Pro Spanish glossary for interface terms, so the toolbox reads like
#     the rest of a Spanish Pro: ráster, capa ráster, pirámides (overviews), teselas
#     (tiles), máscara, banda alfa, informe, referencia espacial, geoprocesamiento,
#     caja de herramientas, cuadro de diálogo.
#   - Messages address the user as "usted"; labels use nouns or infinitives.
#   - Untranslated: GeoTIFF, COG, GDAL, codec names (DEFLATE, LERC, JPEG XL...), NoData,
#     PROJJSON, WKT, IFD, PAM, XMP, XML, TIFF tag numbers, file extensions.
#   - Predictor labels keep their leading digit ("2 - ...").

[toolbox]
"GTTK Toolbox" = "Caja de herramientas GTTK"
"Compression Tools" = "Herramientas de compresión"
"Metadata Tools" = "Herramientas de metadatos"
"Overview and Performance" = "Pirámides y rendimiento"
"Compare Compression" = "Comparar compresión"
"Compares two GeoTIFFs and generates a detailed compression report." = "Compara dos GeoTIFF y genera un informe detallado de la compresión."
"Optimize Compression" = "Optimizar compresión"
"Optimizes and compresses a GeoTIFF into a Cloud Optimized GeoTIFF (COG) with advanced options." = "Optimiza y comprime un GeoTIFF en un GeoTIFF optimizado para la nube (COG) con opciones avanzadas."
"Test Compression" = "Probar compresión"
"Tests multiple compression settings from CSV configurations and generates detailed Excel reports comparing performance and efficiency." = "Prueba múltiples configuraciones de compresión definidas en archivos CSV y genera informes detallados en Excel que comparan rendimiento y eficiencia."
"Read Metadata" = "Leer metadatos"
"Reads the metadata in a GeoTIFF header and generates a report in Markdown or HTML format." = "Lee los metadatos del encabezado de un GeoTIFF y genera un informe en formato Markdown o HTML."
"Validate Metadata" = "Validar metadatos"
"Validates GeoTIFF files against product-specific requirements defined in TOML rule files." = "Valida archivos GeoTIFF contra los requisitos propios de cada producto definidos en archivos de reglas TOML."

