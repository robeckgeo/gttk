[build-system]
requires = ["setuptools>=67.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geotiff-toolkit"
version = "0.12.0"
description = "GeoTIFF ToolKit (GTTK): A Python toolkit for analyzing and optimizing GeoTIFF data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Eric Robeck", email = "robeckgeo@gmail.com" }
]
keywords = ["geotiff", "gdal", "cloud-optimized-geotiff", "elevation", "orthoimagery", "remote-sensing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Utilities"
]

# GDAL is deliberately NOT listed here. The `gdal` package on PyPI is a source
# distribution of the Python bindings only: installing it compiles against an existing
# GDAL C++ library, so on a machine without one pip spends several minutes building
# before failing with `fatal error C1083: Cannot open include file: 'gdal.h'`. Leaving
# it out means `pip install` fails fast and legibly instead. Get GDAL from conda-forge
# (see environment.yml) or OSGeo4W; the `gdal` extra below is for the rare case where
# the library and its headers are already present.
dependencies = [
  "jsonpath-ng>=1.5.0",
  "lxml>=5.3.1",
  "matplotlib>=3.10.0",
  "mistune>=3.0.0",
  "numpy>=2.2.0",
  "openpyxl>=3.1.5",
  "psutil>=5.9.0",
  "tifffile>=2025.1.10",
]

[project.optional-dependencies]
# Only useful where the GDAL C++ library and its development headers are already
# installed; otherwise this builds from source and fails. conda-forge is the supported
# route: `conda env create -f environment.yml`.
gdal = ["gdal>=3.11"]
# The test suite's own tools: `pip install -e ".[dev]"`. environment.yml carries the same.
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[project.urls]
Homepage = "https://github.com/robeckgeo/gttk"
Repository = "https://github.com/robeckgeo/gttk"
Issues = "https://github.com/robeckgeo/gttk/issues"
Changelog = "https://github.com/robeckgeo/gttk/blob/main/CHANGELOG.md"

[project.scripts]
gttk = "gttk.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages]
find = { where = ["."] , include = ["gttk*"] }

[tool.setuptools.package-data]
# Everything under gttk/resources ships: the rule files, the JS and CSS the reports
# embed, the CSV and XLSX templates `gttk test` reads, the TOML themes, catalogs and
# default config, the icons and the two JSON lookups. The previous list of extensions
# covered none of the JS, CSV, XLSX or non-i18n TOML files; they shipped only because
# include-package-data plus MANIFEST.in rescued them.
gttk = ["resources/**/*"]

[tool.setuptools.exclude-package-data]
# The caches the build scripts fill, and compiled bytecode
gttk = [
    "resources/esri/cache/*",
    "resources/tiff/cache/*",
    "**/__pycache__/*",
]


[tool.coverage.run]
# What `pytest --cov` measures. pytest.ini deliberately carries no coverage flags, so a
# plain `pytest` never rewrites the report; this is the one file coverage.py reads.
source = ["gttk"]
branch = true

[tool.coverage.report]
show_missing = true
