[pytest]
# Pytest configuration for GeoTIFF Toolkit

# Python path - ensure project root is in path
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
# gttk is here so that --doctest-modules reaches the docstring examples in the
# source. Without it, the flag would only ever look at tests/.
testpaths = tests gttk

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=10
    --doctest-modules
    --doctest-continue-on-failure

# Coverage is opt-in: `pytest --cov`, with its settings in pyproject.toml (the only
# file coverage.py reads), and the CI job asks for it explicitly. The --cov flags used
# to sit in addopts, which made every invocation -- one test file, --collect-only --
# rewrite .coverage, coverage.xml and htmlcov/, so the table on disk described whatever
# had run last rather than the suite. tests/unit/test_pytest_config.py keeps them out.

# Docstring examples run as part of the suite; see the Doctests section of
# CLAUDE.md for the house rules. NORMALIZE_WHITESPACE lets a long expected value
# be wrapped for readability.
#
# Setting this at all turns OFF pytest's default, which is ELLIPSIS -- deliberately.
# A blanket ELLIPSIS lets an example end an expected value with '...' and pass
# without anyone ever comparing it to the real one, which is how several of these
# examples came to describe output the code had not produced in releases. An
# example that genuinely needs it now asks for it per-example with
# `# doctest: +ELLIPSIS`.
doctest_optionflags = NORMALIZE_WHITESPACE

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    unit: marks tests as unit tests
    renderer: marks tests for renderer classes
    models: marks tests for data models
